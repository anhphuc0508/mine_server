plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

configurations {
    demoFabricApi {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    demoFabricApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.register('copyMods', Sync) {
    description = 'Collect the demo mod and the matching Fabric API for the launcher mods folder.'
    group = 'build'
    dependsOn tasks.jar
    from(tasks.jar.archiveFile)
    from(configurations.demoFabricApi)
    into layout.projectDirectory.dir('mods')
}

tasks.named('build') {
    dependsOn tasks.named('copyMods')
}

tasks.named('test') {
    useJUnitPlatform()
}

