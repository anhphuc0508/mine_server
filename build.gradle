plugins {
    id 'java'
    id 'application'
}

group = 'com.t48project'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.Minestom:Minestom:master-SNAPSHOT'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    implementation 'com.github.hollow-cube:polar:main-SNAPSHOT'
    implementation 'it.unimi.dsi:fastutil:8.5.15'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'com.github.Minestom.Minestom:testing:master-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

application {
    mainClass = 'org.example.Main'
}

test {
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'minestom.inside-test', 'true'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
